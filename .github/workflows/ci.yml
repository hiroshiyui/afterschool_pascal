# Continuous integration for Afterschool Pascal.
#
# What this checks that a developer's machine cannot: **the build needs cmake,
# make and clang, and nothing of LLVM's**. That is the claim ADR-0085 made and
# v1.0.0 shipped, and it is unfalsifiable on a machine that already has LLVM 21
# installed -- which every machine this compiler has ever been built on does.
# Since ADR-0232 removed the C++ reference front end it needs no C++ compiler
# either, which this workflow is also where anyone would find out. So the jobs below run in minimal containers and install
# exactly what the documented build instructions name.
#
# That is not decoration: the first run of this workflow failed, because
# `--no-install-recommends` gives no `make` and README.md had said `clang` and
# nothing else. A missing dependency fails here and nowhere else.
#
# It adds no oracle. It runs the ones that already exist, on a machine that has
# never seen this repository -- see doc/roadmap.md, "What is next", for what is
# still missing and why CI does not supply it.
#
# One of those oracles is not in this repository. The Unicode Character
# Database is fetched rather than committed, so the `ctest` case for it *skips*
# wherever nobody has fetched it -- which was every container here, leaving that
# oracle running only on a developer's machine. A job of its own fetches it and
# runs it.
#
# Such jobs exist because a `ctest` case that *skips* is reported as a pass, and
# a skip is how a check silently stops being one: `unicode-conformance` and
# `second-backend` each install what their case needs and then grep the log to
# refuse a green bar that skipped. A third, `validation-suite`, ran the 1982 BSI
# Pascal Validation Suite until ADR-0232 removed the conformance modes it
# validated. `second-backend` is also the one job that
# installs something the documented build does not need -- `llvm`, for `llc` --
# which is exactly why it is a job and not a step of `test`: putting it there
# would falsify the claim the first paragraph makes, with nothing to report it.

name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: build and test on ${{ matrix.image }}
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        # Two images for two clang versions, and that is the point rather than
        # breadth: the seed modules were emitted by clang 21, and whether an
        # *older* assembler accepts it is a portability property nothing else
        # here checks. The floor is clang 15 -- the IR uses opaque pointers
        # (`ptr`), which no earlier release parses.
        image: ['debian:trixie', 'ubuntu:24.04']

    steps:
      - name: Install the documented dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates cmake make clang libclang-rt-dev git python3
          # Cross compilers, for `target-sizes` and nothing else. They build no
          # artefact this repository ships: what they answer is whether
          # PAS_FILE_SIZE and PAS_JUMP_SIZE are large enough somewhere other
          # than here, which is a question one machine cannot ask (ADR-0155).
          #
          # **The libc6-dev-*-cross packages are not optional.** Debian and
          # Ubuntu ship the driver and its C library separately, and with
          # --no-install-recommends the driver arrives alone: it then runs,
          # fails to find <setjmp.h>, and the first version of this job read
          # that as the size being too small. The compiler is on PATH and
          # cannot compile anything, which is the state target_sizes.sh now
          # tells apart from both "absent" and "wrong".
          apt-get install -y --no-install-recommends \
            gcc-aarch64-linux-gnu libc6-dev-arm64-cross \
            gcc-arm-linux-gnueabihf libc6-dev-armhf-cross
          # z3 for verify/, from pip, which is what verify/README.md documents.
          # --break-system-packages because Debian and Ubuntu both mark their
          # Python installations externally managed (PEP 668).
          #
          # NOT the distro's python3-z3, and this was measured rather than
          # assumed: Debian trixie ships z3 4.13.3, which is slow enough on the
          # two symbolic 32-bit modulo rules that both exceed verify.py's
          # 30-second per-rule timeout. A timeout is reported through the same
          # channel as a counterexample, so the run reads "verification FAILED:
          # mod-is-non-negative" -- a red bar accusing the compiler of getting
          # `mod` wrong when the solver was merely slower. Which z3 is
          # installed decides whether the proofs pass; pinning the documented
          # one is the least surprising way to settle that.
          apt-get install -y --no-install-recommends python3-pip
          pip3 install --break-system-packages z3-solver

      - uses: actions/checkout@v4

      - name: Record which toolchain proved it
        run: |
          clang --version
          cmake --version | head -1

      - name: Require z3, so the proofs cannot silently skip
        run: python3 -c 'import z3; print("z3", z3.get_version_string())'
        # verify/verify.py *skips* when z3 is absent, so that a checkout
        # without it still tests green. That is right for a developer and
        # wrong for CI: it would report 435 passing tests with the 43 SMT
        # rules never run. This step is what makes the green bar mean they did,
        # and it is a step of its own so that its name is what fails.

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
        # No LLVM_DIR. Nothing links libLLVM since ADR-0085, and if this line
        # ever needs one again, that is a regression rather than a nuisance.

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Test
        run: ctest --test-dir build --output-on-failure -j"$(nproc)"
        env:
          # This job installed those two cross compilers, so `target-sizes`
          # must reach them: without this it reports a missing toolchain and
          # passes, which would be a green run that asked nothing. Same
          # arrangement as `second-backend`, which installs llc and refuses to
          # pass by skipping.
          TARGET_SIZES_REQUIRE: aarch64-linux-gnu arm-linux-gnueabihf
        # 435 cases: the two corpora, the 157 error-path sources, the SMT
        # rules, the stage-2/stage-3 fixed point, and the product check.

      - name: Compile a program by hand
        run: |
          tools/pascalcc tests/hello.pas -o /tmp/hello
          /tmp/hello
        # The suite drives pascalcc through run_test.sh with a build tree's
        # paths in the environment. This is the plain invocation a reader gets
        # from README.md, with nothing set.

  unicode-conformance:
    # One of the two oracles in this repository that nobody here wrote -- the
    # only one until ADR-0234, the BSI suite having gone with the conformance
    # modes (ADR-0189, ADR-0232). AP 6.4.15 rests on Normalization
    # Form C and on where an extended grapheme cluster ends, and neither is
    # something a reading taken in this repository could be trusted to settle --
    # which is ADR-0072's blind spot exactly. Unicode publishes the answers.
    #
    # A job of its own so a red bar names the oracle: the fetch is a step
    # with a name, so a red bar caused by unicode.org being unreachable is
    # distinguishable from a red bar caused by the runtime being wrong.
    name: the Unicode conformance files
    runs-on: ubuntu-latest
    container: 'debian:trixie'

    steps:
      - name: Install the documented dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates cmake make clang libclang-rt-dev git python3 curl

      - uses: actions/checkout@v4

      - name: Fetch the pinned Unicode Character Database
        run: runtime/unicode/fetch.sh
        # The version is pinned in that script and moving it is a decision
        # (AP 6.4.15.12): which code points make one element, and whether two
        # values are equal, both change with it. The directory it writes is
        # gitignored and stays that way.

      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j"$(nproc)"

      - name: Run it, and refuse to pass by skipping
        env:
          UNICODE_CONFORMANCE_REQUIRE: '1'
        run: |
          set -o pipefail
          ctest --test-dir build -R unicode-conformance --output-on-failure \
            2>&1 | tee /tmp/unicode.log
          # The case skips (77) without the database and ctest calls a skip
          # success, which is right for a checkout and wrong here -- this job
          # would go green having compared nothing. The env above makes the
          # script itself refuse; this is the belt to its braces, and it is what
          # doc/sop.md 7's row about this file's single reader relies on.
          if grep -q 'Skipped' /tmp/unicode.log; then
            echo "the conformance files were skipped, so this job proved" \
                 "nothing" >&2
            exit 1
          fi

  fpc-differential:
    # The other oracle nobody here wrote (ADR-0234), and the only one that is a
    # *processor* rather than published data. Every program in tests/ otherwise
    # has exactly one reader.
    #
    # A job of its own, and the reason is the row this closes in doc/sop.md 7:
    # the gate skips without `fpc`, which is right -- `fpc` is not a documented
    # dependency and must not become one, the whole build needing clang and
    # nothing else. But a gate that skips everywhere runs nowhere, and every
    # other skipping oracle here is covered by a job that refuses to skip. This
    # is that job for this one.
    #
    # Free Pascal is not an authority: it implements neither standard
    # completely and has never heard of this dialect. A disagreement is a
    # contradiction to be judged against the clause, which is what
    # tests/checks/fpc_disagreements.txt records for each.
    name: a second processor answers the corpus
    runs-on: ubuntu-latest
    container: 'debian:trixie'

    steps:
      - name: Install the documented dependencies, and Free Pascal
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates cmake make clang libclang-rt-dev git python3
          apt-get install -y --no-install-recommends fpc

      - uses: actions/checkout@v4

      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j"$(nproc)"

      - name: Run it, and refuse to pass by skipping
        env:
          FPC_DIFFERENTIAL_REQUIRE: '1'
        run: |
          set -o pipefail
          ctest --test-dir build -R fpc-differential --output-on-failure \
            2>&1 | tee /tmp/fpc.log
          # The case skips (77) without `fpc` and ctest calls a skip success,
          # which is right for a checkout and wrong here -- this job would go
          # green having compared nothing. The env above makes the script itself
          # refuse; this is the belt to its braces.
          if grep -q 'Skipped' /tmp/fpc.log; then
            echo "fpc was skipped, so this job compared nothing" >&2
            exit 1
          fi

  seed-is-current:
    # The seed is refreshed at release tags and nowhere else (ADR-0085), which
    # makes "was it refreshed?" a question only a tag can ask. At a release
    # commit the committed seed must equal what the compiler built *from* it
    # emits for the current source -- that is the fixed point, and a seed left
    # stale by a release breaks it. Nothing else would notice: a stale seed
    # still builds a working compiler, from the previous release's source.
    name: the committed seed is the one this source produces
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    container: 'debian:trixie'

    steps:
      - name: Install the documented dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates cmake make clang libclang-rt-dev git python3

      - uses: actions/checkout@v4

      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j"$(nproc)"

      - name: Regenerate and compare
        # tests/checks/seed_current.sh is the whole of the check, and it is a
        # script so that a release can run the same text by hand before it
        # tags -- this job runs only at a tag, so anything living here has
        # nowhere to be exercised first, and twice now something written here
        # has failed for that reason alone. A `run:` block in a container is
        # `sh -e {0}`, which is the sharper half of it: the bash this file's
        # steps look like they are written in is not what runs them.
        run: tests/checks/seed_current.sh

  # The corpus under AddressSanitizer, UndefinedBehaviorSanitizer and
  # LeakSanitizer (ADR-0261). It is a `ctest` case and so runs in the job above
  # too; it is here as well for the reason `unicode-conformance` is -- a gate
  # that can skip needs one place that refuses to let it, and this one skips
  # with 77 when clang or ar is missing.
  #
  # `SANITIZE_REQUIRE` is that refusal. A green run of this job means the
  # sanitizers actually ran, not that they were absent.
  sanitizers:
    name: the corpus under ASan, UBSan and LeakSanitizer, and the tasks under TSan
    runs-on: ubuntu-latest
    container: 'debian:trixie'
    steps:
      - name: Install the documented dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates cmake make clang libclang-rt-dev git python3 binutils \
            llvm
      - uses: actions/checkout@v4
      - name: Configure and build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j"$(nproc)"
      - name: Run the sanitizer sweep
        run: tests/checks/sanitize.sh tools/pascalcc build/bin/pascalc
        env:
          # The comment above this job named this variable for as long as the
          # job existed and nothing read it -- the step refused a skip by
          # grepping its own log instead, so the mechanism worked and the
          # sentence describing it was false (ADR-0330). The script reads it
          # now, the way every other gate here reads its own, and
          # `require-consistency` is what keeps the two in step.
          SANITIZE_REQUIRE: '1'

      - name: Run the thread sweep, and refuse to pass by skipping
        run: tests/checks/sanitize.sh tools/pascalcc build/bin/pascalc
        env:
          # ADR-0327 landed this gate with no job requiring it, which is the
          # shape `doc/sop.md` §7 already records for `fpc-differential` and
          # for `target32` -- a `*_REQUIRE` nobody sets answers on the machine
          # its author had.
          SANITIZE_MODE: thread
          SANITIZE_REQUIRE: '1'

      - name: Install Valgrind
        run: apt-get install -y --no-install-recommends valgrind

      - name: The corpus under Valgrind, and refuse to pass by skipping
        run: tests/checks/sanitize.sh tools/pascalcc build/bin/pascalc
        env:
          # The fourth mode of the same harness (ADR-0353), and the only one
          # that instruments nothing. It belongs in this job because it asks
          # the question the three steps above cannot: ADR-0342 established
          # that clang's sanitizer passes act on functions carrying an
          # attribute and this emitter writes none, so what they watch is
          # `runtime/*.c` and not one line of the compiled Pascal. Valgrind
          # reads the binary instead.
          #
          # `valgrind` is its own package and is not a documented build
          # dependency, which is the whole reason the gate can skip and
          # therefore the whole reason this variable exists (ADR-0330).
          SANITIZE_MODE: valgrind
          VALGRIND_REQUIRE: '1'

      - name: Measure the runtime's line coverage, and refuse to pass by skipping
        run: tests/checks/runtime_coverage.py tools/pascalcc build/bin/pascalc
        env:
          # The third mode of the same harness (ADR-0351), and it belongs in
          # this job rather than a new one: it needs exactly what the two steps
          # above need, plus `llvm-profdata` and `llvm-cov` from the `llvm`
          # package -- a separate one from `clang`, which is the whole reason
          # the gate can skip.
          #
          # It is also the number those two steps were missing. ADR-0342
          # established that AddressSanitizer never instruments compiled
          # Pascal, so what they watch is `runtime/*.c` and only that; an
          # uncovered line here is a line all four checkers looked at zero
          # times.
          RUNTIME_COVERAGE_REQUIRE: '1'

  unoptimised:
    # The corpus compiles at -O2, which is pascalcc's default and what a user
    # gets. That left `-O0` almost unexercised, and a codegen defect visible
    # only without the optimiser had nothing looking for it: ADR-0102's storage
    # leak survived 495 tests, the validation suite and the SMT proofs, because
    # LLVM hoists an alloca whose address does not escape and the whole leak
    # disappears at -O2.
    #
    # So this job runs the same suite with AFTERSCHOOL_PASCAL_OPT=-O0. A case
    # with a name.opt sidecar keeps its own level -- a case pins one because
    # the *other* cannot see what it is testing, and a sweep must not undo
    # that.
    #
    # **`the same suite` was not true until ADR-0335.** `sanitize.sh` compiled
    # its 383 programs at a level it chose itself and read the variable not at
    # all, so this job made the claim above on every push with two of its cases
    # -- `sanitizers` and `thread-sanitizer` -- quietly at -O1. It honours it
    # now, and all three levels are clean.
    #
    # It is a job rather than a second local ctest run because it doubles the
    # time and finds nothing on most changes. Run it by hand before touching
    # CodeGen: AFTERSCHOOL_PASCAL_OPT=-O0 ctest --test-dir build
    name: the corpus at -O0
    runs-on: ubuntu-latest
    container: 'debian:trixie'

    steps:
      - name: Install the documented dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates cmake make clang libclang-rt-dev git python3

      - uses: actions/checkout@v4

      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j"$(nproc)"

      - name: Test at -O0
        run: ctest --test-dir build --output-on-failure -j"$(nproc)"
        env:
          AFTERSCHOOL_PASCAL_OPT: -O0

  aarch64:
    # The first job that *runs* this compiler on a machine that is not x86-64.
    #
    # Everything doc/roadmap.md's cross-platform chapter measured stopped at
    # **links**: every seed module assembles for aarch64, runtime/pasrt.c
    # compiles, a complete pascalc binary links -- and none of it had ever been
    # executed, because the machine those were measured on has no emulator. A
    # port claimed and not run is the failure mode doc/sop.md §7 exists for,
    # and GitHub's arm64 runners are what supply the missing half.
    #
    # Three things it settles that no x86-64 job can:
    #
    #  1. **The seed retargets textually.** each seed module states an x86-64
    #     triple and datalayout; clang here overrides both and builds a working
    #     seed from all 181,302 lines of it. That is what breaks the
    #     chicken-and-egg seed/README.md describes -- a compiler for a new host
    #     without a compiler on the new host -- and it is now run rather than
    #     argued.
    #  2. **LlSize and LlAlign are right for a second machine.** They are
    #     hand-written and answer with one number for every target (ADR-0028).
    #     `target-layout` compares the two targets' offsets without leaving
    #     x86-64; this compiles and *runs* the corpus whose frames those rules
    #     laid out.
    #  3. **PAS_JUMP_SIZE is large enough where it was too small.** `jmp_buf`
    #     is 312 bytes here against x86-64's 200, and the constant was 256
    #     until ADR-0155. `target-sizes` predicted this from x86-64; this is
    #     the machine it was predicting about.
    #
    # AFTERSCHOOL_PASCAL_TARGET is set so the compiler emits the aarch64 header
    # rather than leaving clang to override an x86-64 one silently (ADR-0156).
    # Without it the job would pass while saying nothing about the arm that ADR
    # added -- which is the same "green run that asked nothing" the
    # TARGET_SIZES_REQUIRE below exists to refuse.
    #
    # No z3, and that skip is deliberate: verify/ proves properties of the
    # *lowering model*, which is the same Python file on either machine, and
    # the two x86-64 jobs already require the proofs to run. Nothing about them
    # is a question about this host.
    name: the compiler on aarch64
    runs-on: ubuntu-24.04-arm
    container: 'debian:trixie'

    steps:
      - name: Install the documented dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates cmake make clang libclang-rt-dev git python3
          # Cross compilers for `target-sizes`, mirrored: the host is aarch64
          # here, so the target it cannot ask about itself is x86-64. Same
          # packaging trap as the other direction -- the driver and its C
          # library are separate packages and --no-install-recommends gives
          # only the driver, which then cannot find <setjmp.h>.
          apt-get install -y --no-install-recommends \
            gcc-x86-64-linux-gnu libc6-dev-amd64-cross \
            gcc-arm-linux-gnueabihf libc6-dev-armhf-cross

      - uses: actions/checkout@v4

      - name: Refuse to pass on the wrong machine
        run: |
          uname -m
          test "$(uname -m)" = aarch64
        # `runs-on` is a request, not a guarantee, and a job named for an
        # architecture that quietly ran on another one would be the loudest
        # possible version of a check that asks nothing.

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j"$(nproc)"
        # This step is the first of the three claims above on its own: it
        # assembles seed/*.ll for aarch64 and then compiles
        # selfhost/compiler.pas with the result.

      - name: Test
        run: ctest --test-dir build --output-on-failure -j"$(nproc)"
        env:
          AFTERSCHOOL_PASCAL_TARGET: aarch64-linux-gnu
          TARGET_SIZES_REQUIRE: x86_64-linux-gnu arm-linux-gnueabihf

      - name: Compile and run a program by hand
        run: |
          tools/pascalcc tests/hello.pas -o /tmp/hello
          /tmp/hello
        # No `file` here: it is not in the minimal container, and asking for it
        # would install a package the documented build does not name, which is
        # the line the first paragraph of this workflow draws. What the binary
        # is was already settled by the step that requires `uname -m`.
        #
        # With nothing set, which is what a reader of README.md on an arm64
        # machine gets: the compiler still states x86-64 in the module it
        # writes and clang overrides it. That path has to work too, and it is
        # the one an unaware user takes.

  second-backend:
    # Is the compiler *binary* miscompiled? Nothing else here can ask.
    # `selfhost/irtest.sh` compiles the compiler with itself twice and requires
    # stage 2 to equal stage 3 -- but both stages come from one binary, so a
    # clang that got a corner of selfhost/compiler.pas wrong would build a wrong
    # compiler that reproduced itself exactly, and every golden would agree
    # because that binary wrote them. This builds the compiler a second way,
    # through `llc` at a different optimisation level, and requires the two to
    # translate the same source to byte-identical IR.
    #
    # **A job of its own, and that is the whole reason it is not a step of
    # `test`.** It needs `llvm`, which the documented build does not -- ADR-0085's
    # claim is that nothing here needs anything of LLVM's, and this workflow
    # exists to keep that claim falsifiable. Adding `llvm` to the `test` job's
    # install line would destroy the property those containers are there to
    # check, and nothing would report it: the suite would still pass.
    #
    # The ctest case skips when llc is absent, exactly as verify-lowering does
    # without z3, so a developer needs none of this. This job is what makes it
    # run somewhere.
    name: a second backend disagrees about nothing
    runs-on: ubuntu-latest
    container: 'debian:trixie'

    steps:
      - name: Install the documented dependencies, and LLVM on top
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates cmake make clang libclang-rt-dev git python3
          # The one package no other job here may have. Deliberately *not*
          # pinned to a version: it comes from the same distro package set as
          # this container's clang, so both are 19.1.7 and the check compares
          # two configurations of one LLVM rather than two LLVMs. Pinning a
          # second version would make it a genuine second reader of the IR --
          # and would put an apt repository into the one job whose premise is
          # that the documented build needs nothing of LLVM's. That trade needs
          # an ADR before it is made, not a commit.
          apt-get install -y --no-install-recommends llvm

      - uses: actions/checkout@v4

      - name: Record which LLVM proved it, and that it is one and not two
        run: |
          llc --version | head -3
          clang --version | head -1
        # Both, because the check's strength depends on the answer: equal
        # versions means one LLVM in two configurations, and the comparison is
        # only a second *reader* of the IR if they ever diverge. A reader of a
        # green bar should not have to guess which it was.

      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j"$(nproc)"

      - name: Run it, and refuse to pass by skipping
        run: ctest --test-dir build -R llc-second-backend --output-on-failure
        env:
          # The case skips (exit 77) without llc and ctest reports a skip as
          # success, so this job would go green having assembled nothing. This
          # was a grep of the job's own log until ADR-0331; the gate reads the
          # variable now, so it refuses a skip however it is run, and
          # `require-consistency` keeps the two lists in step.
          LLC_REQUIRE: '1'

  second-backend-aarch64:
    # The same question as `second-backend`, asked where the answer can differ
    # (ADR-0331).
    #
    # `doc/sop.md` §7 has carried this: *a miscompilation of the compiler that
    # only an aarch64 backend produces has nothing looking for it*. The
    # `aarch64` job builds and runs the whole corpus there, which catches a
    # compiler that is wrong -- and cannot catch one that is wrong *and*
    # reproduces itself, because both stages of `irtest.sh` come from one
    # binary and every golden was written by it.
    #
    # It was filed as a resource problem and it is not one. The objection in
    # `second-backend`'s header is against putting `llvm` into the container
    # the *other* jobs share, because ADR-0085's claim is that the documented
    # build needs nothing of LLVM's and this workflow exists to keep that
    # falsifiable. A job of its own carries no such objection, and GitHub's
    # arm64 runners are already used by the job above.
    #
    # What it varies is the backend *configuration* and not the reader: llc and
    # clang share LLVM's parser and verifier. On this host that configuration
    # is the aarch64 one, which is the whole point.
    name: a second backend disagrees about nothing, on aarch64
    runs-on: ubuntu-24.04-arm
    container: 'debian:trixie'

    steps:
      - name: Install the documented dependencies, and LLVM on top
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates cmake make clang libclang-rt-dev git python3
          apt-get install -y --no-install-recommends llvm

      - uses: actions/checkout@v4

      - name: Record which LLVM proved it, and on which machine
        run: |
          uname -m
          llc --version | head -3
          clang --version | head -1
          echo "target: $AFTERSCHOOL_PASCAL_TARGET"
        # The target is here as well as in the gate's own output, because
        # `ctest --output-on-failure` shows a case's output only when it fails
        # -- so on the green run that matters the line the gate prints is
        # captured and never seen. This job spent every run of its life
        # proving x86-64 while saying it proved aarch64 (ADR-0345), and the
        # whole of what is in place against that happening again is a reader
        # of this log.
        env:
          AFTERSCHOOL_PASCAL_TARGET: aarch64-linux-gnu

      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j"$(nproc)"
        env:
          # As the `aarch64` job does: emit this machine's header rather than
          # leaving clang to override an x86-64 one silently (ADR-0156).
          AFTERSCHOOL_PASCAL_TARGET: aarch64-linux-gnu

      - name: Run it, and refuse to pass by skipping
        run: ctest --test-dir build -R llc-second-backend --output-on-failure
        env:
          LLC_REQUIRE: '1'
          AFTERSCHOOL_PASCAL_TARGET: aarch64-linux-gnu

  tls:
    # `lib/dialect/pastls.pas` transcribes numbers out of OpenSSL's headers --
    # some are macros no `external` declaration can reach -- and a wrong one
    # fails **quietly**: `SSL_VERIFY_PEER` written as 0 turns verification off
    # and every behavioural case stays green (ADR-0264).
    #
    # `TLS_REQUIRE` is that refusal, and it has existed since ADR-0264 with
    # **no job setting it** -- the fourth instance of the shape `doc/sop.md` §7
    # records, and the one nobody had noticed, found by writing the gate that
    # compares the two lists (ADR-0330). Until now this check answered on a
    # machine that happened to have libssl and on no other.
    #
    # A job of its own for `second-backend`'s reason: libssl and the `openssl`
    # program are not documented dependencies of this compiler, and adding them
    # to the container every other job shares would make the documented list a
    # lie.
    name: the numbers copied out of OpenSSL are still OpenSSL's
    runs-on: ubuntu-latest
    container: 'debian:trixie'

    steps:
      - name: Install the documented dependencies, and OpenSSL on top
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates cmake make clang libclang-rt-dev git python3
          apt-get install -y --no-install-recommends libssl-dev openssl

      - uses: actions/checkout@v4

      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j"$(nproc)"

      - name: Run it, and refuse to pass by skipping
        run: ctest --test-dir build -R tls --output-on-failure
        env:
          TLS_REQUIRE: '1'

  thirty-two-bit:
    # Does the corpus still run when a pointer is four bytes? (ADR-0325)
    #
    # `target32` builds a runtime for `i386-pc-linux-gnu` and runs all 570
    # corpus sources against a catalogue. It exists because `target-layout`
    # passed with `tests/dialect/select.pas` segfaulting: both defects the
    # 32-bit port found were in neither a layout rule nor a frame, so no
    # arithmetic check here could see them.
    #
    # **A job of its own, for `second-backend`'s reason.** It needs a 32-bit
    # libc, which the documented build does not, and putting that into the
    # `test` job's install line would make the documented dependency list a
    # lie. The ctest case skips (77) without it, so a developer needs none of
    # this.
    #
    # It is here because `doc/sop.md` §7 recorded `TARGET32_REQUIRE` as a
    # variable nothing sets -- exactly the shape that register already carries
    # for `fpc-differential`, which shipped with a `*_REQUIRE` no job set and
    # answered only on the machine its author had.
    name: a pointer is four bytes
    runs-on: ubuntu-latest
    container: 'debian:trixie'

    steps:
      - name: Install the documented dependencies, and a 32-bit libc on top
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates cmake make clang libclang-rt-dev git python3
          # The packages no other job here needs. `libc6-dev-i386` is what
          # `clang --target=i386-pc-linux-gnu` links against and `libc6-i386`
          # carries the loader the resulting binary names -- both halves are
          # required, because this gate *runs* what it builds and a link that
          # succeeds proves nothing about that.
          #
          # `gcc-multilib` is the third and it is the C library's *other* half:
          # clang links every program against `crtbeginS.o`, `-lgcc` and
          # `-lgcc_s`, which come from GCC and not from libc, and the 32-bit
          # copies of those are in no package the two above depend on. Without
          # it the job died at its own probe, on three `cannot find` lines
          # naming files nothing here mentions -- which is what it died on
          # from the day it was written (ADR-0345). The name is the
          # version-independent one on purpose: `libgcc-14-dev:i386` supplies
          # the same files and stops being a package the day Debian moves to
          # GCC 15.
          dpkg --add-architecture i386
          apt-get update
          apt-get install -y --no-install-recommends \
            libc6-dev-i386 libc6-i386 gcc-multilib

      - uses: actions/checkout@v4

      - name: Record that a 32-bit binary runs here at all
        run: |
          printf 'int main(void){return 0;}\n' > /tmp/probe.c
          clang --target=i386-pc-linux-gnu -o /tmp/probe /tmp/probe.c
          /tmp/probe
          echo "i386 links and runs"
        # Asked with C, before anything of this compiler is built, so a
        # missing package is reported as what it is rather than as a Pascal
        # failure. The gate itself makes the same probe and skips on it; this
        # step is what turns a wrong package name into a red job with an
        # obvious cause.

      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j"$(nproc)"

      - name: Run it, and refuse to pass by skipping
        run: ctest --test-dir build -R target32 --output-on-failure
        env:
          # Without this the case skips wherever the packages above did not
          # arrive, and ctest reports a skip as success -- a green job that
          # built no runtime and ran no program. Same arrangement as
          # `second-backend` and `unicode-conformance`.
          TARGET32_REQUIRE: '1'

      - name: And again at -O0, which is where a wrong ABI shows
        run: ctest --test-dir build -R target32 --output-on-failure
        env:
          TARGET32_REQUIRE: '1'
          AFTERSCHOOL_PASCAL_OPT: '-O0'
        # ADR-0334. `-O0` and i386 was a combination no job here ran: the
        # `unoptimised` job has no 32-bit libc, so `target32` skips in it, and
        # this job took the default -O2. `tests/dialect/int64_foreign.pas`
        # declared C's `labs` as taking an `int64`, which is a wrong ABI on
        # every ILP32 target, and at -O2 the optimiser folded the call away.
        # The gate is the same gate; what was missing was one of its two axes.

  model-drift:
    # doc/sop.md gate A1, made mechanical: verify/lowering.py is a model of the
    # code generator, and the rules prove that model against a statement of the
    # standard -- neither touches the compiler. So a lowering that changes
    # without its model keeps passing while describing a compiler that no
    # longer exists, which is exactly what happened to succ and pred between
    # v1.1.0 and the release after it.
    #
    # The check cannot decide which CodeGen changes touch a modelled lowering;
    # it asks for that judgement to be written down as a `Model-unchanged:`
    # trailer. One line, and it is the line a reviewer reads first.
    name: a lowering change carries its model
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0    # the check needs the range, not just the tip

      - name: Compare the range against verify/
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base='${{ github.event.pull_request.base.sha }}'
          else
            base='${{ github.event.before }}'
          fi
          # The base may be missing (a new branch), all zeros (a tag), or a
          # real SHA that no longer exists (a force-push). model_drift.py's
          # resolve_base decides what to do about each; deciding it here as
          # well would be a second copy of the rule, free to drift from the one
          # the check applies -- and the shell spelling of it is what let a
          # force-push kill this job in run 32131932455.
          python3 tests/checks/model_drift.py "$base" "${{ github.sha }}"

  # ---- A tag ships an archive (ADR-0296) ------------------------------------
  #
  # No release before v3.5.0 carried a binary: `gh release view v3.4.0 --json
  # assets` answered `[]`, and every tag before it the same, so the first step
  # for every newcomer was cmake, clang and a self-hosting bootstrap. The
  # three jobs below make a `v*` tag produce
  # `afterschool-pascal-<tag>-<arch>.tar.gz` with a `.sha256` beside it, in
  # exactly the layout `install-layout` checks, attached to the GitHub release
  # for the tag.
  #
  # **The logic is in `tools/release.sh` and not here**, for the reason
  # `seed-is-current` gives above: a `run:` block at a tag runs nowhere else,
  # and twice now shell living in this file has failed for want of anywhere to
  # be exercised first. `--archive` and `--check` are driven on every push by
  # the `release-archive` ctest case; what this file adds is the tag's name
  # and three `gh` calls, `gh` being on every hosted runner -- which is also
  # why these jobs run on the runner image rather than in the minimal
  # containers the jobs above use, and why no third-party release action is
  # involved.
  #
  # **Draft first, publish last.** `release` creates the release as a draft
  # with the CHANGELOG section as its notes; each `package` leg attaches its
  # archive; `publish` undrafts once every leg has. A user never sees a
  # release with half its archives, and a red `package` leaves a draft to
  # re-run rather than a published release with a hole in it. A release
  # created by hand before the tag is left as it is and only gains assets.
  #
  # **The release needs every oracle green**, not only `test`: a tag that
  # fails `sanitizers` or `second-backend` is not one to ship. The cost is
  # that a transient -- unicode.org unreachable -- blocks the release until
  # the failed job is re-run, which is the right side to err on.
  release:
    name: the GitHub release for the tag, as a draft
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, aarch64, seed-is-current, sanitizers, unoptimised,
            second-backend, unicode-conformance, fpc-differential]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Create the release as a draft, unless one already exists
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG exists already; it will gain assets and nothing else"
          else
            tools/release.sh --notes "$TAG" >notes.md
            gh release create "$TAG" --draft --title "$TAG" --notes-file notes.md
          fi
        # `--notes` refuses a tag with no CHANGELOG.md section, so a release
        # nobody wrote an entry for fails here, before anything is built.

  package:
    # One leg per architecture, and each builds, tests and checks the very
    # binary it uploads: the suite runs over the statically linked compiler
    # the archive holds, not over the dynamically linked one `test` built in
    # a container, and `--check` unpacks the archive into a fresh directory
    # and drives the installed compiler with PATH and nothing else.
    #
    # **What the aarch64 archive claims, and what it does not** (ADR-0296).
    # It is built and the whole suite is run on GitHub's arm64 runner, as the
    # `aarch64` job above has done on every push since ADR-0159. It is built
    # from the x86-64 seed, clang retargeting it -- there is no aarch64 seed
    # and `seed/README.md`'s lock stands; the compiler in it writes an x86-64
    # header unless `--target=` or AFTERSCHOOL_PASCAL_TARGET says otherwise,
    # which clang overrides when it assembles; and `llc-second-backend` has
    # never run on that machine (doc/sop.md 7). The suite is run with the
    # target set so that the arm ADR-0156 added is what is tested, and the
    # archive is checked with nothing set, which is what a user gets.
    name: a release archive for ${{ matrix.arch }}
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [release]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x86_64-linux
            target: x86_64-pc-linux-gnu
          - runner: ubuntu-24.04-arm
            arch: aarch64-linux
            target: aarch64-linux-gnu
          # macOS is **disabled, deliberately, and untried**. The roadmap says
          # it is the cheapest unknown in the tree -- the runtime's five
          # non-ISO names are all there -- and nobody has ever built this
          # compiler on one, so a leg here would be the first run of the port
          # and a release archive at the same time, which is the wrong order:
          # a platform is run before it is shipped. Two things are known to
          # differ and the script already allows for both -- there is no
          # `-static` on macOS, so APASCAL_STATIC_PASCALC would have to be
          # OFF and RELEASE_REQUIRE_STATIC unset, and there is no `ldd`, so
          # `--check` reports the link kind as unknown -- and what else
          # differs is exactly what a first run would find. Enable it as a
          # push job first, then here.
          #
          # - runner: macos-latest
          #   arch: arm64-darwin
          #   target: ''            # no darwin target admitted yet (ADR-0156)

    steps:
      - uses: actions/checkout@v4

      - name: Refuse to package on the wrong machine
        run: |
          uname -m; uname -s
          test "$(uname -m)-$(uname -s | tr '[:upper:]' '[:lower:]')" = "${{ matrix.arch }}"
        # `runs-on` is a request. An archive named for one architecture and
        # holding another would be found by the first person to download it.

      - name: Record which toolchain built it
        run: |
          clang --version | head -1
          cmake --version | head -1

      - name: Configure, with the compiler linked statically
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DAPASCAL_STATIC_PASCALC=ON
        # -static reaches bin/pascalc alone. The runtime the archive ships is
        # an archive of objects the user's own clang links against the user's
        # own C library, so the one thing a static link changes is that the
        # compiler binary no longer requires this runner's glibc or newer.

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Test the compiler that will be shipped
        run: ctest --test-dir build --output-on-failure -j"$(nproc)"
        env:
          AFTERSCHOOL_PASCAL_TARGET: ${{ matrix.target }}
        # Not a repeat of `test`: that job's binary was built in a container
        # and linked dynamically, and this one is what goes into the archive.

      - name: Archive
        run: tools/release.sh --archive build "${{ github.ref_name }}" "${{ matrix.arch }}" dist
        # Refuses a tag that is not the version `pascalc --version` prints.

      - name: Check the archive, the way install-layout checks a prefix
        env:
          RELEASE_REQUIRE_STATIC: '1'
        run: tools/release.sh --check "dist/afterschool-pascal-${{ github.ref_name }}-${{ matrix.arch }}.tar.gz"
        # RELEASE_REQUIRE_STATIC turns the link-kind report into a failure:
        # a job that configured -static and shipped a dynamic binary would
        # otherwise pass with one line in a log saying so.

      - name: Attach it to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.ref_name }}" \
            "dist/afterschool-pascal-${{ github.ref_name }}-${{ matrix.arch }}.tar.gz" \
            "dist/afterschool-pascal-${{ github.ref_name }}-${{ matrix.arch }}.tar.gz.sha256" \
            --clobber
        # --clobber so that a re-run of a leg replaces its archive rather than
        # failing on the one it uploaded before.

  publish:
    name: the release is published
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [package]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Undraft, now that every archive is attached
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${{ github.ref_name }}" --draft=false --repo "${{ github.repository }}"
        # No checkout: the one command needs the repository's name and the
        # token, and both are in the environment. A release that was
        # published by hand before the tag is unchanged by this.
